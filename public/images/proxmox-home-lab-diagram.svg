<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1270" width="600" height="1270" role="img" aria-labelledby="diagram-title diagram-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="diagram-title">Proxmox home lab network diagram</title>
  <desc id="diagram-desc">
    A browser reaches the lab through Cloudflare Access and Cloudflare Tunnel. The tunnel is opened
    outbound by a cloudflared container on the Proxmox host, so no inbound ports are open for management.
    The Proxmox host has two bridges: vmbr0 on the home network with four LXC containers (cloudflared,
    Lychee for photos, Bedrock for Minecraft, and devbox running code-server), and vmbr1, an isolated lab
    bridge with no physical port, holding the DC1, DC2, and SRV1 virtual machines. The lab reaches the
    internet only through NAT to vmbr0. Minecraft players are the one inbound path, through a router port
    forward to the Bedrock container, carrying game traffic only. Storage is an SSD for Proxmox and VM disks
    plus an NVMe drive used as an LVM-thin pool.
  </desc>

  <defs>
    <!-- Arrowheads. The base sits at the end of the line and the tip extends past it,
         so each line stops short of its target by the arrowhead's length. -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="14" markerHeight="14"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-blue-lg" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="20" markerHeight="20"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="14" markerHeight="14"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-indigo" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="14" markerHeight="14"
            markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="600" height="1270" fill="#ffffff"/>

  <!-- ============ INTERNET ============ -->
  <g id="internet">
    <text x="20" y="32" font-size="20" font-weight="600" fill="#6b7280" letter-spacing="2">INTERNET</text>

    <!-- Minecraft players -->
    <rect x="20" y="50" width="220" height="68" rx="12" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
    <text x="36" y="80" font-size="22" font-weight="700" fill="#111827">Minecraft</text>
    <text x="36" y="106" font-size="20" fill="#6b7280">players</text>

    <!-- Browser -->
    <rect x="330" y="50" width="200" height="68" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="430" y="80" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Browser</text>
    <text x="430" y="106" font-size="20" fill="#6b7280" text-anchor="middle">(any device)</text>
  </g>

  <!-- ============ CLOUDFLARE ============ -->
  <g id="cloudflare">
    <rect x="300" y="140" width="280" height="202" rx="16" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <!-- Right-aligned so the vertical tunnel line at x=430 doesn't cross it -->
    <text x="564" y="168" font-size="20" font-weight="700" fill="#374151" text-anchor="end">Cloudflare</text>

    <!-- Access -->
    <rect x="316" y="182" width="228" height="68" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="430" y="210" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Access</text>
    <text x="430" y="236" font-size="20" fill="#6b7280" text-anchor="middle">identity check</text>

    <!-- Tunnel -->
    <rect x="316" y="276" width="228" height="50" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="430" y="308" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Tunnel</text>
  </g>

  <!-- ============ HOME NETWORK ============ -->
  <g id="home-network">
    <rect x="10" y="400" width="580" height="694" rx="18" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/>
    <text x="236" y="448" font-size="22" font-weight="700" fill="#374151">Home network</text>

    <!-- Router sits on the edge of the home network -->
    <rect x="20" y="372" width="200" height="56" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <text x="120" y="408" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">Router</text>
  </g>

  <!-- ============ PROXMOX VE HOST ============ -->
  <g id="proxmox-host">
    <rect x="30" y="466" width="540" height="612" rx="16" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
    <text x="90" y="502" font-size="22" font-weight="700" fill="#111827">Proxmox VE host</text>
  </g>

  <!-- ============ vmbr0: HOME NETWORK BRIDGE ============ -->
  <g id="vmbr0">
    <rect x="46" y="518" width="508" height="238" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="90" y="550" font-size="20" font-weight="700" fill="#1d4ed8">vmbr0 (home network bridge)</text>
    <text x="90" y="576" font-size="20" fill="#6b7280">LXC containers</text>

    <!-- Row 1 -->
    <rect x="60" y="592" width="230" height="68" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="84" y="622" font-size="22" font-weight="700" fill="#111827">Bedrock</text>
    <text x="84" y="648" font-size="20" fill="#6b7280">Minecraft</text>

    <rect x="320" y="592" width="220" height="68" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="3"/>
    <text x="336" y="634" font-size="22" font-weight="700" fill="#111827">cloudflared</text>

    <!-- Row 2 -->
    <rect x="60" y="674" width="230" height="68" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="84" y="704" font-size="22" font-weight="700" fill="#111827">Lychee</text>
    <text x="84" y="730" font-size="20" fill="#6b7280">photos</text>

    <rect x="320" y="674" width="220" height="68" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <text x="336" y="704" font-size="22" font-weight="700" fill="#111827">devbox</text>
    <text x="336" y="730" font-size="20" fill="#6b7280">code-server</text>
  </g>

  <!-- ============ vmbr1: ISOLATED LAB BRIDGE ============ -->
  <g id="vmbr1">
    <rect x="46" y="812" width="508" height="140" rx="14" fill="#eef2ff" stroke="#818cf8" stroke-width="2"
          stroke-dasharray="10 6"/>
    <text x="62" y="842" font-size="20" font-weight="700" fill="#4338ca">vmbr1 (isolated lab bridge)</text>
    <text x="62" y="868" font-size="20" fill="#6b7280">VMs, no physical port</text>

    <rect x="62" y="884" width="150" height="52" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="137" y="917" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">DC1</text>
    <rect x="226" y="884" width="150" height="52" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="301" y="917" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">DC2</text>
    <rect x="390" y="884" width="150" height="52" rx="10" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <text x="465" y="917" font-size="22" font-weight="700" fill="#111827" text-anchor="middle">SRV1</text>
  </g>

  <!-- ============ STORAGE ============ -->
  <g id="storage">
    <rect x="46" y="968" width="508" height="96" rx="14" fill="#f9fafb" stroke="#d1d5db" stroke-width="2"/>
    <text x="62" y="996" font-size="20" font-weight="700" fill="#374151">Storage</text>
    <text x="62" y="1024" font-size="20" fill="#4b5563"><tspan font-weight="700" fill="#111827">SSD:</tspan> Proxmox + VM disks</text>
    <text x="62" y="1050" font-size="20" fill="#4b5563"><tspan font-weight="700" fill="#111827">NVMe:</tspan> LVM-thin pool</text>
  </g>

  <!-- ============ CONNECTIONS ============ -->
  <g id="management-path" stroke="#2563eb" stroke-width="3" fill="none">
    <!-- Browser to Access to Tunnel -->
    <line x1="430" y1="118" x2="430" y2="168" marker-end="url(#arrow-blue)"/>
    <line x1="430" y1="250" x2="430" y2="262" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- The key idea: cloudflared opens the tunnel OUTWARD to Cloudflare -->
  <g id="outbound-tunnel">
    <line x1="430" y1="592" x2="430" y2="346" stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrow-blue-lg)"/>
    <!-- Label pill drawn on top of the line -->
    <rect x="300" y="356" width="260" height="62" rx="31" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
    <text x="430" y="382" font-size="20" font-weight="700" fill="#1d4ed8" text-anchor="middle">Outbound tunnel</text>
    <text x="430" y="406" font-size="20" fill="#4b5563" text-anchor="middle">(no inbound ports)</text>
  </g>

  <!-- The one inbound path: game traffic only, never management -->
  <g id="port-forward" stroke="#d97706" stroke-width="3" stroke-dasharray="9 6" fill="none">
    <line x1="72" y1="118" x2="72" y2="358" marker-end="url(#arrow-amber)"/>
    <line x1="72" y1="428" x2="72" y2="578" marker-end="url(#arrow-amber)"/>
  </g>
  <text x="88" y="222" font-size="20" font-weight="700" fill="#b45309">Port forward</text>
  <text x="88" y="248" font-size="20" fill="#b45309">(game traffic only)</text>

  <!-- NAT: the isolated lab's only way out, through vmbr0 -->
  <g id="nat">
    <line x1="305" y1="812" x2="305" y2="770" stroke="#4f46e5" stroke-width="3" marker-end="url(#arrow-indigo)"/>
    <text x="320" y="792" font-size="20" font-weight="700" fill="#4338ca">NAT (only way out)</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g id="legend">
    <text x="20" y="1136" font-size="20" font-weight="700" fill="#374151">Legend</text>

    <line x1="20" y1="1170" x2="62" y2="1170" stroke="#1d4ed8" stroke-width="5" marker-end="url(#arrow-blue-lg)"/>
    <text x="100" y="1177" font-size="20" fill="#374151">Outbound tunnel (management)</text>

    <line x1="20" y1="1208" x2="68" y2="1208" stroke="#d97706" stroke-width="3" stroke-dasharray="9 6"
          marker-end="url(#arrow-amber)"/>
    <text x="100" y="1215" font-size="20" fill="#374151">Inbound port forward (game traffic only)</text>

    <rect x="20" y="1232" width="62" height="26" rx="6" fill="#eef2ff" stroke="#818cf8" stroke-width="2"
          stroke-dasharray="6 4"/>
    <text x="100" y="1252" font-size="20" fill="#374151">Isolated network (no physical port)</text>
  </g>
</svg>
