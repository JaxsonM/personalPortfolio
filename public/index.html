<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- sizes="any" keeps browsers that support SVG from choosing the .ico instead -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030712" />
    <meta
      name="description"
      content="Jaxson Madison is a Windows Server Administrator deepening his Azure skills and building toward infrastructure automation in a hands-on Proxmox home lab."
    />
    <!-- Open Graph tags control link previews on LinkedIn and in messaging apps -->
    <meta property="og:title" content="Jaxson Madison | Systems Administrator" />
    <meta
      property="og:description"
      content="Jaxson Madison is a Windows Server Administrator deepening his Azure skills and building toward infrastructure automation in a hands-on Proxmox home lab."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jaxsoncodes.com" />
    <!-- Crawlers don't run JavaScript or resolve relative paths, so the image needs a full URL -->
    <meta property="og:image" content="https://jaxsoncodes.com/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Jaxson Madison, Systems Administrator, jaxsoncodes.com" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Jaxson Madison | Systems Administrator</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
